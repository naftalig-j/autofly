name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JFrog Fly
        uses: jfrog/fly-action@v1

      # ── sound-transfer ────────────────────────────────────────────────
      - name: Install sound-transfer dependencies
        run: npm ci
        working-directory: sound-transfer

      - name: Build sound-transfer
        run: npm run build
        working-directory: sound-transfer

      # ── hebrew-letters ────────────────────────────────────────────────
      - name: Install hebrew-letters dependencies
        run: npm ci
        working-directory: hebrew-letters

      - name: Build hebrew-letters
        run: npm run build
        working-directory: hebrew-letters

      # ── combine into one artifact ─────────────────────────────────────
      - name: Combine dist folders
        run: |
          mkdir -p combined
          cp -r sound-transfer/dist/. combined/
          mkdir -p combined/hebrew-letters
          cp -r hebrew-letters/dist/. combined/hebrew-letters/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
